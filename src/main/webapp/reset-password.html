
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Digital Arts Technology</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="auth-frame">
        <form class="auth-card"
            action="ResetPasswordServlet"
            method="post"
                id="resetPasswordForm">

            <h1 class="reset-title">Reset Password</h1>

            <p>Create a new password for your LMS account.</p>

            <p id="resetMessage" role="alert" hidden></p>

            <input type="hidden" name="token" id="resetToken">

            <label for="newPassword">New Password</label>
            <input
                type="password"
                id="newPassword"
                name="newPassword"
                placeholder="Enter new password"
                minlength="8"
                required
            >

            <label for="confirmPassword">Confirm New Password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirm new password"
                minlength="8"
                required
            >

            <p id="passwordError" role="alert" hidden>
                Passwords do not match.
            </p>

            <button type="submit" class="auth-btn">
                Update Password
            </button>

        </form>
    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token");
        const error = params.get("error");

        const form = document.getElementById("resetPasswordForm");
        const message = document.getElementById("resetMessage");
        const tokenInput = document.getElementById("resetToken");
        const newPassword = document.getElementById("newPassword");
        const confirmPassword = document.getElementById("confirmPassword");
        const passwordError = document.getElementById("passwordError");

        const errorMessages = {
            invalid: "Invalid password details. Please try again.",
            expired: "This reset link is invalid or has expired. Please request a new one.",
            failed: "Unable to reset your password. Please try again."
        };

        if (errorMessages[error]) {
            message.textContent = errorMessages[error];
            message.hidden = false;
        }

        if (!token) {
            form.innerHTML = `
                <h1>Invalid Reset Link</h1>
                <p>Please request a new password reset link.</p>
            `;
        } else {
            tokenInput.value = token;
        }

        form.addEventListener("submit", function(event) {
            if (newPassword.value !== confirmPassword.value) {
                event.preventDefault();
                passwordError.hidden = false;
                return;
            }

            passwordError.hidden = true;
        });
    </script>

</body>
</html>
