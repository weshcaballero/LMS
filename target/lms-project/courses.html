
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">

    <title>My Courses | E-Learning System</title>
</head>
<body>
    <div class="app">

        <header class="topbar">
            <a href="home.html" class="brand">
                <img src="./images/Digitalarts.png" alt="Digital Arts Image">

                <div class="brand-text">
                    <span class="brand-name">Digital Arts Technology Training Center Inc.</span>
                    <span class="brand-sub">E-Learning System</span>
                </div>
            </a>

            <nav class="topnav" aria-label="Main">
                <a href="home.html">Home</a>
                <a href="dashboard-student.html">Dashboard</a>
                <a href="courses.html">My Courses</a>
            </nav>

            <div class="topbar-actions">
                <button type="button" class="bell" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2z"/>
                    </svg>
                    <span class="bell-dot"></span>
                </button>

                <a href="profile.html" class="avatar" id="userAvatar">ST</a>

                <a href="LogoutServlet" class="logout-link">Log out</a>
            </div>
        </header>

        <main class="courses">

            <form class="course-search" id="courseSearch" role="search">
                <label for="courseQuery" class="sr-only">Search courses</label>

                <input
                    type="search"
                    id="courseQuery"
                    placeholder="Search..."
                    autocomplete="off"
                >

                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.5" cy="10.5" r="6.5"/>
                    <path d="M15.5 15.5 21 21"/>
                </svg>
            </form>

            <!-- Dynamic courses from MyCoursesServlet -->
            <div class="course-list" id="courseList">

                <p id="coursesLoading">Loading your courses...</p>

                <!-- Course cards will be generated by my-courses.js -->

                <a
                    href="#"
                    class="add-course"
                    aria-label="Add a course"
                    title="Add a course"
                >
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 8v8M8 12h8"/>
                    </svg>
                </a>

            </div>

            <p class="no-results" id="noResults" hidden>
                No courses match your search.
            </p>

        </main>
    </div>

    <script src="js/portal.js" defer></script>
    <script src="js/my-courses.js" defer></script>
    <script src="js/user-info.js" defer></script>

</body>
</html>
