<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | E-Learning System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <main class="auth-frame">

        <form class="auth-card" action="LoginServlet" method="post">
            <div class="auth-brand">
                <img src="./images/Digitalarts.png" alt="dattc" class="auth-logo">
                <h1 class="h-title">Digital Arts Technology Training Center Inc.</h1>
            </div>

            <p class="auth-error" role="alert" hidden>Email or password is incorrect. Try again.</p>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" autocomplete="current-password" required>

            <button type="submit" class="auth-btn">LOGIN</button>

            <a href="forgot-password.html" class="auth-forgot">Forgot password</a>

            <p class="auth-create">
                Don't have an account? <a href="register.html">Create new account</a>
            </p>
        </form>
    </main>

    <script src="js/login.js" defer></script>
</body>
</html>
